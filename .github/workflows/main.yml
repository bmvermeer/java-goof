name: Java CI with Maven

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK 8
      uses: actions/setup-java@v1
      with:
        java-version: 8
    - name: build with Maven
      run: mvn clean install
    - name: run with tomcat
      run: | 
        cd todolist-goof/todolist-web-struts/
        mvn tomcat7:run
    - name: run script
      run: |
        cd ../exploits/
        . struts-exploit.sh 
        
      
  
